server:
  port: 8222

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb:// = tim instance qua Eureka theo ten service, khong hard-code host:port
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
